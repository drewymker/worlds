<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match - 36620B Blue Crew | VEX Worlds 2025</title>
  <meta name="description" content="Watch match footage from Team 36620B Blue Crew at VEX Worlds 2025">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="match-page">
    <!-- Header -->
    <header class="header">
      <div class="container header-content">
        <div class="header-left">
          <a href="#" class="back-link" id="backLink">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 19-7-7 7-7"></path>
              <path d="M19 12H5"></path>
            </svg>
            <span class="back-text">Back to Day</span>
          </a>
        </div>
        <div class="header-right">
          <a href="#" class="external-link" id="externalLink" target="_blank" rel="noopener noreferrer">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
            <span class="external-text">Open Original</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Video Section -->
    <section class="video-section">
      <div class="container">
        <!-- Video Container -->
        <div class="video-container fade-in">
          <iframe id="videoPlayer" src="" title="Match Video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <!-- Match Info -->
        <div class="match-info">
          <!-- Title and Badges -->
          <div class="match-header fade-in fade-delay-1">
            <div class="match-badges">
              <span class="badge badge-primary" id="matchType">Qualification</span>
              <span class="badge badge-secondary" id="matchDay">Day 1</span>
            </div>
            <h1 class="match-title" id="matchTitle">Qualification Match Q1-001</h1>
          </div>

          <div class="match-date fade-in fade-delay-1">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span id="matchDateText">Wednesday, April 23, 2025</span>
          </div>

          <!-- Teams Section -->
          <div class="teams-grid">
            <!-- Red Alliance -->
            <div class="alliance-card alliance-red fade-in fade-delay-2">
              <div class="alliance-header">
                <div class="alliance-indicator red"></div>
                <h3>Red Alliance</h3>
              </div>
              <div class="teams-list" id="redTeams">
                <!-- Red teams will be populated by JavaScript -->
              </div>
            </div>

            <!-- Blue Alliance -->
            <div class="alliance-card alliance-blue fade-in fade-delay-3">
              <div class="alliance-header">
                <div class="alliance-indicator blue"></div>
                <h3>Blue Alliance</h3>
              </div>
              <div class="teams-list" id="blueTeams">
                <!-- Blue teams will be populated by JavaScript -->
              </div>
            </div>
          </div>

          <!-- Navigation -->
          <div class="match-nav fade-in fade-delay-4">
            <a href="#" class="btn btn-outline" id="moreDayMatches">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              More Day Matches
            </a>
            <a href="index.html" class="btn btn-outline">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                <path d="M4 22h16"></path>
                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
              </svg>
              All Competition Days
            </a>
          </div>
        </div>

        <!-- Not Found State -->
        <div class="not-found hidden" id="notFound">
          <h2>Match not found</h2>
          <a href="index.html" class="btn btn-outline">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 19-7-7 7-7"></path>
              <path d="M19 12H5"></path>
            </svg>
            Back to Home
          </a>
        </div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderMatchPage();
    });
  </script>
</body>
</html>
